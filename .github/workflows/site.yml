name: site

# Deploys site/ (open.margincode.dev) to Cloudflare Workers static assets (wrangler.jsonc). Needs the
# repository secrets CLOUDFLARE_ACCOUNT_ID and an API token, as CLOUDFLARE_API_TOKEN or under the
# name CLOUDFLARE_API_KEY. It must be a scoped API token (Account > Workers Scripts > Edit, and
# Zone > Workers Routes > Edit on margincode.dev for the custom domain), not the account's
# Global API Key. Without them the deploy step is skipped. See site/README.md.

on:
  push:
    branches: [main, master]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Skipped
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN (or CLOUDFLARE_API_KEY) / CLOUDFLARE_ACCOUNT_ID not set; site not deployed."
