# The answer to set.toml, by record id. `category` is one of the design's (section 8 of the
# conflict verdict's design): `planted` (a record whose own words tell agents to do what the
# rule forbids; `rule` names it), `overlap` (same subject as a rule, no contradiction),
# `silent` (the anchored code breaks a rule, the record says nothing about it), `attempt` (a
# try that broke a rule), `untouched` (no rule bears on it), `code-disputes` (the anchored code
# contradicts the record or has moved on). `rule` on a control names the rule it is close to.

[r01]
category = "planted"
rule = "art-cents"
older = true
why = "says to compute the discount on a float total; seeded before the articles"

[r02]
category = "silent"
rule = "art-logs"
why = "create_invoice_handler logs the customer's name and email; the record is about currencies"

[r03]
category = "overlap"
rule = "conv-params"
why = "a column name from an allow-list in ORDER BY is not a value; the value stays a parameter"

[r04]
category = "planted"
rule = "conv-twice"
why = "says a retried reminder job sends the whole batch again"

[r05]
