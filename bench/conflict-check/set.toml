summary = "refunds.py is an exception to the cents rule: it keeps the provider's refund amounts as Decimal dollars from end to end, because the provider reconciles in dollars."
body = "Converting to cents and back made the reconciliation report differ from the provider's statement in the last digit. The amounts never leave refunds.py as anything but Decimal."
anchors = [{ path = "billing/refunds.py", symbol = "refund_total" }]

