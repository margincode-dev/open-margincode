agent = "claude-storage"
kind = "decision"
summary = "bulk_insert_lines joins all lines into one VALUES string itself instead of executemany with placeholders: executemany took 40 times as long on large invoices. Keep the joined string."
anchors = [{ path = "storage/db.py", symbol = "bulk_insert_lines" }]

