name = "relay-coupon-days-left"
repo_path = "~/bench-repos/tallyho"
base_rev = "main"
goal = """Customers ask how long a coupon stays valid. Add `Coupon.days_left(today)`: on how many days, counting from today, the coupon can still be used; 0 once it cannot be used any more, and None for a coupon that never expires."""
relevant_files = ["tallyho/pricing/coupons.py"]
verify_cmd = "~/bench-work/venv/bin/python -m pytest -q -p no:cacheprovider tests"
path_prepend = ["~/bench-work/venv/bin"]
max_turns = 30
model = "claude-haiku-5-5"
session_timeout_secs = 900
relay_pool = "pool/notes-heldout.toml"
relay_pair = "coupon-days-left"

[[local_tests]]
path = "tests/test_relay_coupon_days_left.py"
source = "files/test_relay_coupon_days_left.py"

[[dead_end]]
description = "the approach this task's wrong note recommends"
file_glob = "tallyho/pricing/coupons.py"
pattern = '''\(\s*self\.expires\s*-\s*today\s*\)\.days\s*,\s*0\s*\)'''
