name = "relay-order-can-cancel"
repo_path = "~/bench-repos/tallyho"
base_rev = "main"
goal = """The order page hides its Cancel button once an order can no longer be cancelled. Add `Order.can_cancel()`: True while the order can still be cancelled, False once it cannot."""
relevant_files = ["tallyho/models.py"]
verify_cmd = "~/bench-work/venv/bin/python -m pytest -q -p no:cacheprovider tests"
path_prepend = ["~/bench-work/venv/bin"]
max_turns = 30
model = "claude-haiku-5-5"
session_timeout_secs = 900
relay_pool = "pool/notes-heldout.toml"
relay_pair = "order-can-cancel"

[[local_tests]]
path = "tests/test_relay_order_can_cancel.py"
source = "files/test_relay_order_can_cancel.py"

[[dead_end]]
description = "the approach this task's wrong note recommends"
file_glob = "tallyho/models.py"
pattern = '''return\s+self\.status\s+(is|==)\s+OrderStatus\.DRAFT\b'''
